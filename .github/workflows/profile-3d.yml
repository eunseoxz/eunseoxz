name: profile-3d-contrib

on:
  schedule:
    - cron: "0 18 * * *" # daily, 01:00 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Generate 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: eunseoxz
          SETTING_JSON: .github/profile-3d/settings.json

      - name: Keep only the city and contribution count
        run: python3 .github/profile-3d/strip-3d.py profile-3d-contrib/profile-opendesk-teal.svg

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git commit -m "chore: update 3d contribution city"; then
            git push
          fi
